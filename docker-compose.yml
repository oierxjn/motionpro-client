# MotionPro 代理服务端（容器 netns 隔离部署）
#
# 前置: 宿主需有 /dev/net/tun；config.py 与 docker-compose.yml 同目录。
# 端口只发布到 Tailscale IP（按需修改），避免暴露在物理网卡上。
services:
  motionpro-proxy:
    build: .
    image: motionpro-proxy:latest
    container_name: motionpro-proxy
    restart: unless-stopped
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - NET_ADMIN            # TUN 创建 + 容器内路由装配（netns 本地, 不碰宿主）
    # 容器内显式 DNS: 宿主 resolv.conf 若指向 Tailscale MagicDNS(100.100.100.100),
    # 其上游对部分域名(如 vpn.tongji.cn)返回空答案, 会导致容器无法解析网关
    dns: [223.5.5.5, 119.29.29.29]
    ports:
      - "100.100.129.3:1080:1080"    # SOCKS5 ← 绑定 Tailscale IP（宿主 8080 被 casaos 占用, HTTP 换 18081）
      - "100.100.129.3:18081:8080"   # HTTP
    volumes:
      - ./config.py:/app/config.py:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
