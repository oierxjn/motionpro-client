# MotionPro 代理服务端（容器 netns 隔离部署）
#
# 前置: 宿主需有 /dev/net/tun；config.py 与 docker-compose.yml 同目录。
# 端口默认只绑宿主回环（不对外暴露）；要给其他设备用时改成 0.0.0.0/内网 IP。
services:
  motionpro-proxy:
    build: .
    image: motionpro-proxy:latest
    container_name: motionpro-proxy
    restart: unless-stopped
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - NET_ADMIN            # TUN 创建 + 容器内路由装配（netns 本地, 不碰宿主）
    # 容器内显式 DNS: 宿主 resolv.conf 若指向 Tailscale MagicDNS(100.100.100.100),
    # 其上游对部分域名(如 vpn.tongji.cn)返回空答案, 会导致容器无法解析网关
    dns: [223.5.5.5, 119.29.29.29]
    ports:
      # 默认只绑宿主回环(最安全, 不对外暴露): 本机验证直接 127.0.0.1, 远程
      # 使用走 SSH 转发(ssh -L 1080:127.0.0.1:1080 ...); 要给其他设备提供
      # 代理时改成 0.0.0.0 或内网 IP(务必保留强认证)。
      # HTTP 用 18081→8080 映射: 宿主 8080 端口常被其他服务占用, 避免冲突
      - "127.0.0.1:1080:1080"    # SOCKS5
      - "127.0.0.1:18081:8080"   # HTTP
      - "127.0.0.1:9090:9090"    # Web 控制面板（config.py 里 panel_listen: 0.0.0.0:9090）
    volumes:
      - ./config.py:/app/config.py:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
